services:
  backend:
    build: ./backend
    image: backend
    networks:
      - practice
      - db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"
      interval: 5s
      timeout: 3s
      retries: 3

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - dataB:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build: ./nginx
    networks:
      - practice
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - -fk
        - "https://localhost/nginx-health"
      interval: 5s
      timeout: 3s
      retries: 3

  prometheus:
    build: ./monitoring/prometheus
    networks:
      - practice
    volumes:
      - prom:/prometheus

  grafana:
    build: ./monitoring/grafana
    networks:
      - practice
    volumes:
      - graf:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_SERVER_ROOT_URL
      - GF_SERVER_SERVE_FROM_SUB_PATH

volumes:
  dataB:
  prom:
  graf:

networks:
  practice:
    driver: bridge # default, no need to type out explicitly
  db:
    internal: true # cannot publish ports on internal networks
