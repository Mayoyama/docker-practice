services:
  back_end:
    build: ./backend
    image: back_end
    networks:
      - practice
      - db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - DB_HOST=db
    ports:
      - "5000:5000"

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - dataB:/var/lib/postgresql
    networks:
      - db

volumes:
  dataB:

networks:
  practice:
    driver: bridge # default, no need to type out explicitly
  db:
    internal: true # cannot publish ports on internal networks
