services:
  back_end:
    build: ./backend
    image: back_end
    networks:
      - practice
      - db
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - dataB:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build: ./nginx
    networks:
      - practice
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - back_end

volumes:
  dataB:

networks:
  practice:
    driver: bridge # default, no need to type out explicitly
  db:
    internal: true # cannot publish ports on internal networks
